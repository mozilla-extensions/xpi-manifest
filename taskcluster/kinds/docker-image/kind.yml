---

loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.docker_image:transforms
    - taskgraph.transforms.cached_tasks:transforms
    - taskgraph.transforms.task:transforms

tasks:
    node-latest:
        definition: node
        args:
            NODE_VERSION: "latest"
    node-lts-latest:
        definition: node
        args:
            NODE_VERSION: "lts"
    node-18:
        definition: node
        args:
            NODE_VERSION: "18.20.4"
    node-20:
        definition: node
        args:
            NODE_VERSION: "20.15.1"
    node-22:
        definition: node
        args:
            NODE_VERSION: "22.14.0"
    node-22-pnpm-bun:
        parent: node-22
        definition: node-pnpm-bun
        args:
            PNPM_VERSION: "10.7.1"
            BUN_VERSION: "1.1.13"
